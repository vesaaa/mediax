name: AndroidX Media3 FFmpeg Decoder / Build

# 仅版本标签 push 时跑完整构建并发包；main/master 分支 push 不触发。
# 支持：1.8.1、v1.8.1、1.8.2-beta1、1.8.2-av3a1、1.8.0+vstv1 等
on:
  pull_request:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-beta*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta*'
      - '*-av3a*'
      - 'v*-av3a*'
      - '1.8.0+vstv*'
      - '*vstv*'

permissions:
  contents: read
  packages: write

env:
  NDK_VER: 26.1.10909125
  CMAKE_VER: 3.31.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Cache NDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VER }}
          key: ${{ runner.os }}-${{ env.NDK_VER }}

      - name: Install correct NDK and CMake
        run: sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      # AV3A 预编译库无 soname，需 patchelf 补 DT_SONAME，否则 libffmpegJNI.so 会把构建机绝对路径写进 NEEDED。
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Patch upstream minCompileSdk to 35 for published AAR metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("media/common_config.gradle")
          txt = p.read_text(encoding="utf-8")
          old = "minCompileSdk = project.ext.compileSdkVersion"
          new = "minCompileSdk = 35"
          if old not in txt:
            raise SystemExit(f"pattern not found in {p}: {old!r}")
          p.write_text(txt.replace(old, new, 1), encoding="utf-8")
          print("patched", p)
          PY

      - name: Normalize shell scripts (LF)
        run: find . -name '*.sh' -not -path './.git/*' -exec sed -i 's/\r$//' {} +

      - name: Fetch patched FFmpeg for AV3A (av3a 标签)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'av3a')
        run: bash scripts/fetch-av3a-ffmpeg.sh

      - name: Apply AV3A FfmpegLibrary mapping (av3a 标签)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'av3a')
        run: bash scripts/apply-av3a-java-overlay.sh

      # av3a 包仅发布 ffmpeg-decoder，不含 extractor；跳过 DV/FLV overlay，
      # 避免 overlay 后的 NalUnitUtil 与未重置到 1.8.0 的子模块 VvcConfig 不一致导致编译失败。
      - name: Apply media extractor overlays (DV TS + Enhanced FLV)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'av3a')) }}
        env:
          # vstv extractor 必须与 VSTV app 的 Media3 1.8.x 同基线编译（见 scripts/README-MEDIA-EXTRACTOR-OVERLAYS.md）
          MEDIAX_MEDIA_REF: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, '+vstv')) && '1.8.0' || '' }}
        run: bash scripts/apply-media-extractor-overlays.sh

      - name: Build ffmpeg (h264/hevc/vp9/av1/opus + Jellyfin audio; av3a 标签自动 ENABLE_AV3A=1)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || !contains(github.ref, '+vstv')
        env:
          ENABLE_AV3A: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'av3a')) && '1' || (vars.MEDIAX_ENABLE_AV3A || '0') }}
        run: bash ./build.sh

      - name: Build extension (Maven local layout for CI artifact)
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            if [[ "$VER" == *"+vstv"* ]]; then
              bash ./gradlew :media3-extractor-vstv:publishToMavenLocal -Pjellyfin.version="$VER"
            elif [[ "$VER" == *"av3a"* ]]; then
              bash ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal -Pjellyfin.version="$VER"
            else
              bash ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal :media3-extractor-vstv:publishToMavenLocal -Pjellyfin.version="$VER"
            fi
          else
            bash ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal :media3-extractor-vstv:publishToMavenLocal
          fi

      - name: Validate armeabi-v7a AV3A companion ELF (av3a tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'av3a')
        run: |
          chmod +x scripts/validate-av3a-arm32-elf.sh
          mapfile -t AARS < <(find ~/.m2/repository/org/jellyfin/media3/media3-ffmpeg-decoder -name '*.aar' 2>/dev/null)
          if [[ "${#AARS[@]}" -eq 0 ]]; then
            echo "::error::未找到 media3-ffmpeg-decoder AAR"
            exit 1
          fi
          bash scripts/validate-av3a-arm32-elf.sh "${AARS[@]}"

      - name: Publish to GitHub Packages (semver tag only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          if [[ "$VER" == *"+vstv"* ]]; then
            bash ./gradlew :media3-extractor-vstv:publishDefaultPublicationToGitHubPackagesRepository --no-daemon -Pjellyfin.version="$VER"
          elif [[ "$VER" == *"av3a"* ]]; then
            bash ./gradlew :media3-ffmpeg-decoder:publishDefaultPublicationToGitHubPackagesRepository --no-daemon -Pjellyfin.version="$VER"
          else
            bash ./gradlew :media3-ffmpeg-decoder:publishDefaultPublicationToGitHubPackagesRepository :media3-extractor-vstv:publishDefaultPublicationToGitHubPackagesRepository --no-daemon -Pjellyfin.version="$VER"
          fi

      - name: Upload Maven-local layout (org/jellyfin/media3)
        uses: actions/upload-artifact@v4
        with:
          name: maven-org-jellyfin-media3
          path: ~/.m2/repository/org/jellyfin/media3/
